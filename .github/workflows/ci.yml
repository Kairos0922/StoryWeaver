name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run validate
      - run: node scripts/build-vercel-t01.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: t01-english-colors-final
          path: public/experiments/t01-english-colors
