name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run validate
      - run: npm run validate-production
      - run: npm run method-proof
      - run: npm run production-01
      - run: node scripts/build-vercel-t01.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: method-proof
          path: out/method-proof
      - uses: actions/upload-artifact@v4
        with:
          name: t01-english-colors-final
          path: public/experiments/t01-english-colors
      - uses: actions/upload-artifact@v4
        with:
          name: production-01
          path: |
            out/production-01
            public/production/ai-video-is-not-ppt
