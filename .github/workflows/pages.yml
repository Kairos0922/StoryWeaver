# GitHub Pages deploy is parked until a repo admin enables Pages.
# Actions cannot create the Pages site: configure-pages@v5 with enablement:true
# returns "Resource not accessible by integration".
#
# After Settings → Pages → Source = GitHub Actions, restore the deploy jobs
# (configure-pages + upload-pages-artifact + deploy-pages) or re-run this file
# from git history. Until then, `npm run pages` in CI still builds `_site`
# and uploads the `pages-site` artifact.
name: GitHub Pages

on:
  workflow_dispatch:

jobs:
  skipped:
    runs-on: ubuntu-latest
    steps:
      - name: Pages not enabled on this repository
        run: |
          echo "GitHub Pages is not enabled, and GITHUB_TOKEN cannot create it."
          echo "Enable it once: Settings → Pages → Build and deployment → Source: GitHub Actions"
          echo "Then restore deploy jobs in this workflow."
          echo "Static docs are still built on CI via npm run pages (artifact: pages-site)."
